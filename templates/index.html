<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SYLPH ~a multibot</title>
  <script>
    // Set the theme before the page paints, so there is no light/dark flash.
    (function () {
      var theme = "light";
      try {
        theme = localStorage.getItem("sylph-theme") ||
          (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      } catch (e) {}
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body data-persona="general">
  <div class="glow" aria-hidden="true"></div>
  <div class="scrim" id="scrim"></div>

  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="Chat history">
      <div class="sidebar-head">
        <div class="wordmark small" aria-label="SYLPH, a multibot">
          <span class="wm-big">SYLPH</span><span class="wm-small">~a multibot</span>
        </div>
        <button id="close-btn" class="round-btn" type="button" aria-label="Close sidebar">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m13 6-6 6 6 6M19 6l-6 6 6 6"/></svg>
        </button>
      </div>

      <button id="new-chat-btn" class="new-chat-btn" type="button">+ New chat</button>
      <input id="search" class="search" type="search" placeholder="Search chats" aria-label="Search chats">

      <ul id="chat-list" class="chat-list"></ul>
      <div class="sidebar-foot">Ctrl + B shows or hides this panel</div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button id="menu-btn" class="round-btn" type="button" aria-label="Show sidebar" aria-expanded="false">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
        </button>
        <div class="topbar-title">
          <span id="chat-persona" class="chat-persona"></span>
          <h2 id="chat-title" class="chat-title"></h2>
        </div>
        <button id="new-chat-top" class="round-btn" type="button" aria-label="New chat">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <button id="theme-btn" class="round-btn" type="button" aria-label="Switch theme"></button>
      </header>

      <div id="messages" class="messages" aria-live="polite"></div>

      <form id="chat-form" class="chat-form">
        <textarea id="chat-input" rows="1" placeholder="Ask me anything"></textarea>
        <button id="send-btn" type="submit" aria-label="Send message">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><path d="M3 11.5 21 3l-7.5 18-2.5-8z"/><path d="M11 13 21 3"/></svg>
        </button>
      </form>
      <p class="fineprint">SYLPH can make mistakes. Messages are sent to Google Gemini, so avoid sharing personal details.</p>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="/script.js"></script>
</body>
</html>
